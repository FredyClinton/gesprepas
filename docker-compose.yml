services:
  postgres:
    image: postgres:18
    container_name: excelis_prepas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-excelis_prepas}
      POSTGRES_USER: ${DB_USER:-username}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - excelis_prepas_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-username} -d ${DB_NAME:-excelis_prepas}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  excelis_prepas_data:
