spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: "optional:file:../.env[.properties]"
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:excelis_prepas}
    username: ${DB_USER:username}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        "[format_sql]": true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    # V1_1 (rattrapage des tables autrefois créées par Hibernate) a été ajoutée après
    # V31 : sans out-of-order, les bases existantes la refuseraient au démarrage.
    out-of-order: true

server:
  port: ${SERVER_PORT:8080}

#noinspection SpringBootApplicationProperties
app:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:20}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none

logging:
  level:
    root: INFO
    com.excelisprepas.backend: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.tool.schema: WARN